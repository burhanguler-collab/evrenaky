<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Adım 2: Evrenakı Kapsülü ve Katar Oluşumu</title>
    <style>
        body { 
            background: #4a154b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: white; 
            font-family: sans-serif; 
        }
        canvas { 
            background: #4a154b; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            border-radius: 10px; 
            position: relative;
        }
        .container { 
            text-align: center; 
            position: relative;
        }
        .replay-btn {
            position: absolute;
            top: 60px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .replay-btn:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 20px; font-weight: 300;">Adım 2: Çoklu Molekül Katarı ve Birleşik Evrenakı Kapsülü</h2>
        <div style="position: relative; display: inline-block;">
            <canvas id="animCanvas" width="800" height="600"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('animCanvas');
        const ctx = canvas.getContext('2d');
        
        let startTime = null;

        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }

        function animate(time) {
            if (!startTime) startTime = time;
            const elapsed = time - startTime;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // ZAMAN TÜNELİ
            const p1 = Math.max(0, Math.min(1, elapsed / 2000)); 
            const p2 = Math.max(0, Math.min(1, (elapsed - 2000) / 1000)); 
            const p3 = Math.max(0, Math.min(1, (elapsed - 3000) / 2500)); 
            const p4 = Math.max(0, Math.min(1, (elapsed - 5500) / 1000)); 
            const p5_fadeout = elapsed > 10500 ? Math.max(0, 1 - (elapsed - 10500) / 500) : 1; 
            const p6_neighbors = elapsed > 11000 ? Math.max(0, Math.min(1, (elapsed - 11000) / 1000)) : 0; 
            const p7_unified = elapsed > 12000 ? Math.max(0, Math.min(1, (elapsed - 12000) / 2000)) : 0; 
            // 15. saniyede çizgiler silinir ve küçülme başlar
            const p9_shrink = elapsed > 15000 ? Math.max(0, Math.min(1, (elapsed - 15000) / 2000)) : 0; 

            const atomSpacing = 60;
            const numNeighbors = 80; // 1/10 küçüldüğünde dahi ekranı kaplaması için artırıldı 

            // YENİ: Kapsülün alt ve üstündeki dış uzay alanları (Yeşil gradyanlar)
            // Kapsül birleşirken (p7, yani 6. adımın hemen ardından) zaten var olur, kapsül büyükken üstteki ekranın en üstünde, alttaki en altında görünür.
            // Kapsül küçülüp aşağı indikçe (8. adımda), bu alanlar da onun sınırlarıyla birlikte hareket eder ve kadraja girer.
            if (p7_unified > 0) {
                const currentScale = p9_shrink > 0 ? 1.0 - (0.9 * easeInOut(p9_shrink)) : 1.0;
                const currentCenterY = p9_shrink > 0 ? cy + (220 * easeInOut(p9_shrink)) : cy;
                const currentTopY = currentCenterY - (220 * currentScale); // Kapsülün o anki üst sınırı
                const currentBottomY = currentCenterY + (220 * currentScale); // Kapsülün o anki alt sınırı

                ctx.globalAlpha = p7_unified;
                const gradHeight = 200; 
                
                // Üst Gradyan (currentTopY'den başlayıp yukarı doğru uzanır)
                const topGrad = ctx.createLinearGradient(0, currentTopY, 0, currentTopY - gradHeight);
                topGrad.addColorStop(0, 'rgba(57, 255, 20, 0.6)'); // Sınır tabakasındaki neon yeşil
                topGrad.addColorStop(1, 'rgba(57, 255, 20, 0.0)'); // Yukarı doğru şeffaflaşır
                ctx.fillStyle = topGrad;
                ctx.fillRect(0, currentTopY - gradHeight, canvas.width, gradHeight);

                // Alt Gradyan (currentBottomY'den başlayıp aşağı doğru uzanır)
                const bottomGrad = ctx.createLinearGradient(0, currentBottomY, 0, currentBottomY + gradHeight);
                bottomGrad.addColorStop(0, 'rgba(57, 255, 20, 0.6)'); // Sınır tabakasındaki neon yeşil
                bottomGrad.addColorStop(1, 'rgba(57, 255, 20, 0.0)'); // Aşağı doğru şeffaflaşır
                ctx.fillStyle = bottomGrad;
                ctx.fillRect(0, currentBottomY, canvas.width, gradHeight);

                // YENİ: Kütle Dışı Evrenakı Gradyanı Yazıları (Yeşil gradyan oluştuğu anda eklenir)
                ctx.fillStyle = '#39ff14'; // Neon yeşil
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 8;
                ctx.textAlign = 'center';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('Kütle Dışı Evrenakı Gradyanı', cx, currentTopY - 100); // Üst gradyanın ortası
                ctx.fillText('Kütle Dışı Evrenakı Gradyanı', cx, currentBottomY + 100); // Alt gradyanın ortası
                ctx.shadowBlur = 0;

                ctx.globalAlpha = 1;
            }

            // BÜTÜNSEL DÖNÜŞÜM (KÜÇÜLME VE AŞAĞI KAYMA)
            ctx.save();
            if (p9_shrink > 0) {
                const scale = 1.0 - (0.9 * easeInOut(p9_shrink)); // 1.0 -> 0.1
                const targetY = cy + 220; // Orijinal alt çizginin konumu
                const currentY = cy + ((targetY - cy) * easeInOut(p9_shrink)); // Merkez aşağı kayar
                
                ctx.translate(cx, currentY);
                ctx.scale(scale, scale);
                ctx.translate(-cx, -cy);
            }

            // 1. MAİ GRADYANLARI ÇİZİMİ
            const individualMaiOpacity = 1 - p7_unified;
            if (individualMaiOpacity > 0 && p3 > 0) {
                const radius = 220 * easeInOut(p3);
                
                function drawIndividualMai(xOffset, alpha) {
                    if (alpha <= 0 || radius <= 0.1) return;
                    ctx.globalAlpha = alpha * individualMaiOpacity;
                    const gradient = ctx.createRadialGradient(cx + xOffset, cy, Math.max(1, radius * 0.05), cx + xOffset, cy, radius);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)'); 
                    gradient.addColorStop(0.3, 'rgba(200, 130, 220, 0.7)'); 
                    gradient.addColorStop(0.7, 'rgba(120, 40, 150, 0.4)'); 
                    gradient.addColorStop(1, 'rgba(74, 21, 75, 0)');

                    ctx.beginPath();
                    ctx.arc(cx + xOffset, cy, radius, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // Merkez atom için halkaları sadece komşular belirene kadar çiz
                    if (xOffset === 0 && p6_neighbors === 0) {
                        for(let i=1; i<=3; i++) {
                            ctx.beginPath();
                            ctx.arc(cx + xOffset, cy, radius * (i/3), 0, Math.PI * 2);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - i*0.02})`;
                            ctx.lineWidth = 1.5;
                            ctx.stroke();
                        }
                    }
                }

                if (p6_neighbors > 0) {
                    for (let i = numNeighbors; i >= 1; i--) {
                        let neighborAlpha = Math.max(0, Math.min(1, (p6_neighbors * numNeighbors) - (i - 1)));
                        drawIndividualMai(i * atomSpacing, neighborAlpha);
                        drawIndividualMai(-i * atomSpacing, neighborAlpha);
                    }
                }
                drawIndividualMai(0, Math.min(1, p3 * 1.5));
            }

            // B) Birleşik Kapsül MAİ Gradyanı
            if (p7_unified > 0) {
                ctx.globalAlpha = p7_unified;
                const w = numNeighbors * atomSpacing; 
                const r = 220;

                ctx.beginPath();
                ctx.moveTo(cx - w, cy);
                ctx.lineTo(cx + w, cy);
                ctx.lineCap = 'round';
                
                const steps = 30;
                for (let i = steps; i >= 1; i--) {
                    const currentR = (r * i) / steps;
                    const ratio = i / steps; 
                    
                    let r_c, g_c, b_c, a_c;
                    if (ratio < 0.3) {
                        const t = ratio / 0.3;
                        r_c = 255 + t * (200 - 255);
                        g_c = 255 + t * (130 - 255);
                        b_c = 255 + t * (220 - 255);
                        a_c = 0.9 + t * (0.7 - 0.9);
                    } else if (ratio < 0.7) {
                        const t = (ratio - 0.3) / 0.4;
                        r_c = 200 + t * (120 - 200);
                        g_c = 130 + t * (40 - 130);
                        b_c = 220 + t * (150 - 220);
                        a_c = 0.7 + t * (0.4 - 0.7);
                    } else {
                        const t = (ratio - 0.7) / 0.3;
                        r_c = 120 + t * (74 - 120);
                        g_c = 40 + t * (21 - 40);
                        b_c = 150 + t * (75 - 150);
                        a_c = 0.4 + t * (0 - 0.4);
                    }
                    
                    ctx.lineWidth = currentR * 2;
                    ctx.strokeStyle = `rgba(${Math.round(r_c)}, ${Math.round(g_c)}, ${Math.round(b_c)}, ${a_c})`;
                    ctx.stroke();
                }
                
                ctx.lineWidth = 1.5;
                for(let i=1; i<=3; i++) {
                    const ringR = r * (i/3);
                    ctx.beginPath();
                    ctx.arc(cx - w, cy, ringR, Math.PI/2, Math.PI*1.5);
                    ctx.lineTo(cx + w, cy - ringR);
                    ctx.arc(cx + w, cy, ringR, -Math.PI/2, Math.PI/2);
                    ctx.closePath();
                    ctx.strokeStyle = `rgba(255, 255, 255, ${0.1 - i*0.02})`;
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            // 2. ÇEKİRDEKLERİN ÇİZİMİ
            function drawNucleus(xOffset, alpha) {
                if (alpha <= 0 || p2 <= 0) return;
                const currentR = 110 - (110 - 14) * easeInOut(p3);
                ctx.globalAlpha = Math.min(1, p2 * 1.5) * alpha;
                
                const sphereGrad = ctx.createRadialGradient(cx + xOffset - currentR/3, cy - currentR/3, Math.max(1, currentR/7), cx + xOffset, cy, currentR);
                sphereGrad.addColorStop(0, '#ffffff');
                sphereGrad.addColorStop(0.4, '#a0d0ff');
                sphereGrad.addColorStop(1, '#305080');

                ctx.beginPath();
                ctx.arc(cx + xOffset, cy, currentR, 0, Math.PI * 2);
                ctx.fillStyle = sphereGrad;
                
                if(p3 >= 1) {
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                    ctx.shadowBlur = 15;
                }
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }

            if (p6_neighbors > 0) {
                for (let i = numNeighbors; i >= 1; i--) {
                    let neighborAlpha = Math.max(0, Math.min(1, (p6_neighbors * numNeighbors) - (i - 1)));
                    drawNucleus(i * atomSpacing, neighborAlpha);
                    drawNucleus(-i * atomSpacing, neighborAlpha);
                }
            }
            drawNucleus(0, 1);

            // 3. İLK AŞAMA ELEKTRON DÖNÜŞÜ
            if (p2 < 1) {
                ctx.globalAlpha = 1 - easeInOut(p2);
                
                const initialNucR = 14;
                const initialNucGrad = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, initialNucR);
                initialNucGrad.addColorStop(0, '#ffffff');
                initialNucGrad.addColorStop(0.4, '#a0d0ff');
                initialNucGrad.addColorStop(1, '#305080');
                
                ctx.beginPath();
                ctx.arc(cx, cy, initialNucR, 0, Math.PI * 2);
                ctx.fillStyle = initialNucGrad;
                ctx.fill();

                const orbitR = 75;
                ctx.beginPath();
                ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);

                const angle = elapsed * 0.005; 
                const ex = cx + orbitR * Math.cos(angle);
                const ey = cy + orbitR * Math.sin(angle);

                ctx.beginPath();
                ctx.arc(ex, ey, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#00ffff';
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.globalAlpha = 1;
            }

            // YENİ: Kapsül içindeki Mikro Atomik Gradyan yazısı (Ölçeklenir ve aşağı kayar)
            if (elapsed > 14000) {
                let textAlpha = 1;
                if (elapsed > 17000) textAlpha = Math.max(0, 1 - (elapsed - 17000) / 1000); // Küçülme bitince yavaşça silinir
                
                ctx.globalAlpha = textAlpha;
                ctx.fillStyle = '#39ff14';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 8;
                ctx.textAlign = 'center';
                ctx.font = 'bold 28px Arial';
                // Hem atomların altına hem de üstüne yazılır (Kapsülün mor alanına)
                ctx.fillText('Mikro Atomik Gradyan', cx, cy - 140);
                ctx.fillText('Mikro Atomik Gradyan', cx, cy + 140);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }

            // DÖNÜŞÜM BLOĞUNU KAPAT
            ctx.restore();

            // 4. METİNLER VE SINIR ÇİZGİLERİ (Küçülme ve Kaymadan Bağımsız)
            
            // İlk sınır tabakası çemberi
            if (p4 > 0 && p5_fadeout > 0) {
                const blRadius = 220;
                let drawCircle = true;
                
                if (elapsed > 6500 && elapsed < 10500) {
                    if (Math.floor((elapsed - 6500) / 500) % 2 === 0) {
                        drawCircle = false;
                    }
                }
                
                ctx.globalAlpha = easeInOut(p4) * p5_fadeout;

                if (drawCircle) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, blRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#39ff14';
                    ctx.lineWidth = 4.0;
                    ctx.setLineDash([8, 8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.fillStyle = '#39ff14';
                ctx.textAlign = 'center';
                ctx.font = 'bold 14px Arial';
                ctx.fillText('Sınır Tabakası (Boundary Layer)', cx, cy - blRadius - 12);

                ctx.globalAlpha = 1;
            }

            // Kapsül Sınır Çizgileri ve Metinleri (17. saniyede p9_shrink başlayınca silinir)
            if (p7_unified > 0 && p9_shrink === 0) {
                const r = 220;
                ctx.globalAlpha = p7_unified;
                
                ctx.fillStyle = '#39ff14';
                ctx.textAlign = 'center';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('Sınır Tabakası', cx, cy - r - 10);
                ctx.fillText('Sınır Tabakası', cx, cy + r + 25);

                let drawLines = true;
                if (elapsed > 12000 && elapsed < 14000) {
                    if (Math.floor((elapsed - 12000) / 250) % 2 === 0) {
                        drawLines = false;
                    }
                }

                if (drawLines) {
                    ctx.lineWidth = 4.0;
                    ctx.strokeStyle = '#39ff14';
                    ctx.setLineDash([15, 10]);
                    
                    ctx.beginPath();
                    ctx.moveTo(0, cy - r);
                    ctx.lineTo(canvas.width, cy - r);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(0, cy + r);
                    ctx.lineTo(canvas.width, cy + r);
                    ctx.stroke();

                    ctx.setLineDash([]);
                }

                ctx.globalAlpha = 1;
            }

            // Son sahne 3 saniye kalsın (17s + 3s = 20s) ve sonra döngü başlasın
            if (elapsed > 20000) {
                startTime = time;
            }

            requestAnimationFrame(animate);
        }

        // Animasyonu Başlat
        requestAnimationFrame(animate);
    </script>
</body>
</html>

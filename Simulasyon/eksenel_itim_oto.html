<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eksenel İtim (Axial Push) Simülasyonu</title>
<style>
  :root {
    --bg: #0b0f19;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --accent: #00e5ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden; /* iframe için uygun */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="cv"></canvas>
  </div>
<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  
  // Responsive canvas setup
  function resize() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; 
    cv.height = H * dpr;
    ctx.scale(dpr, dpr);
    return { W, H };
  }
  
  let dims = resize();
  window.addEventListener('resize', () => { dims = resize(); });

  const state = {
    massSpeed: 1.0,
    gradSpeed: 3.0,
    showForce: true
  };
  
  let massAngle = 0;
  let gradAngle = 0;
  let lastTime = performance.now();
  let timeGlobal = 0;
  
  const numParticles = 300;
  const particles = [];
  for(let i=0; i<numParticles; i++) {
    particles.push({
      angle: Math.random() * Math.PI * 2,
      r: 60 + Math.random() * 260,
      size: Math.random() * 2.5 + 0.5,
      speedPhase: Math.random() * 10
    });
  }

  function drawBackground(W, H) {
    ctx.fillStyle = '#050811';
    ctx.fillRect(0, 0, W, H);
  }

  function drawGradientVortex(cx, cy) {
    const gradient = ctx.createRadialGradient(cx, cy, 30, cx, cy, 320);
    gradient.addColorStop(0.0, 'rgba(0, 229, 255, 0.9)');
    gradient.addColorStop(0.2, 'rgba(0, 180, 220, 0.6)');
    gradient.addColorStop(0.5, 'rgba(0, 80, 120, 0.2)');
    gradient.addColorStop(1.0, 'rgba(0, 20, 40, 0.0)');
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, 320, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(gradAngle);
    
    const numArms = 8;
    for(let i=0; i<numArms; i++) {
      ctx.beginPath();
      const armAngle = (i / numArms) * Math.PI * 2;
      for (let r = 50; r <= 320; r += 10) {
        const theta = armAngle - (r * 0.012); 
        const x = r * Math.cos(theta);
        const y = r * Math.sin(theta);
        if (r === 50) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(0, 229, 255, ${0.15 + (state.gradSpeed * 0.02)})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    
    ctx.fillStyle = 'rgba(0, 255, 255, 0.6)';
    particles.forEach(p => {
      const diffSpeed = (350 - p.r) * 0.001 * state.gradSpeed;
      const tAngle = p.angle - diffSpeed; 
      const px = p.r * Math.cos(tAngle);
      const py = p.r * Math.sin(tAngle);
      
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    
    ctx.restore();
  }

  function drawCentralMass(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(massAngle);
    
    const r = 45;
    
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 15;
    
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = '#0f172a';
    ctx.fill();
    
    ctx.shadowBlur = 0;
    
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
    
    ctx.beginPath(); ctx.arc(0, 0, r * 0.6, 0, Math.PI*2); ctx.stroke();
    
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function drawAxialPushForces(cx, cy) {
    if (!state.showForce || state.gradSpeed === 0) return;
    
    const numArrows = 12;
    const arrowLen = 30 + (state.gradSpeed * 3);
    
    const pulse = (Math.sin(timeGlobal * 5) + 1) / 2;
    const pushRadius = 240 - (pulse * 20) - (state.gradSpeed * 5);
    
    ctx.save();
    ctx.translate(cx, cy);
    
    for(let i = 0; i < numArrows; i++) {
      const angle = (i / numArrows) * Math.PI * 2;
      
      const startR = pushRadius + arrowLen;
      const endR = pushRadius;
      
      const x0 = startR * Math.cos(angle);
      const y0 = startR * Math.sin(angle);
      const x1 = endR * Math.cos(angle);
      const y1 = endR * Math.sin(angle);
      
      const alpha = Math.min(0.3 + (state.gradSpeed * 0.1) + (pulse * 0.3), 1.0);
      
      ctx.strokeStyle = `rgba(255, 176, 32, ${alpha})`;
      ctx.fillStyle = `rgba(255, 176, 32, ${alpha})`;
      ctx.lineWidth = 2.5 + (state.gradSpeed * 0.2);
      ctx.lineCap = 'round';
      
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
      
      const headLen = 10 + (state.gradSpeed * 0.5);
      const headAngle = Math.PI / 6;
      
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(
        x1 + headLen * Math.cos(angle + headAngle),
        y1 + headLen * Math.sin(angle + headAngle)
      );
      ctx.lineTo(
        x1 + headLen * Math.cos(angle - headAngle),
        y1 + headLen * Math.sin(angle - headAngle)
      );
      ctx.closePath();
      ctx.fill();
    }
    
    ctx.restore();
  }

  function animate(time) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    timeGlobal += dt;
    
    const baseRotSpeed = 1.5; 
    massAngle += state.massSpeed * baseRotSpeed * dt;
    gradAngle += state.gradSpeed * baseRotSpeed * dt;

    const { W, H } = dims;
    const cx = W / 2;
    const cy = H / 2;

    ctx.clearRect(0, 0, W, H);
    drawBackground(W, H);
    drawGradientVortex(cx, cy);
    drawCentralMass(cx, cy);
    drawAxialPushForces(cx, cy);
    
    requestAnimationFrame(animate);
  }
  
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>

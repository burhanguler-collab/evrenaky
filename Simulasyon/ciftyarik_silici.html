<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuantum Silici (Quantum Eraser) Deneyi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; box-sizing: border-box; }
        h2 { text-align: center; font-size: 20px; color: #fff; margin-top:0; }
        .subtitle { text-align: center; font-size: 14px; color: #a3a3a3; margin-bottom: 20px; }
        .controls { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #404040; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; }
        .control-group { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 250px; }
        label { font-size: 14px; font-weight: bold; color: #e5e5e5; }
        select, input[type="range"] { padding: 8px; border-radius: 6px; background: #111; color: #fff; border: 1px solid #525252; width: 100%; box-sizing: border-box; }
        .toggle-btn { background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .toggle-btn.active { background: #16a34a; }
        canvas { background: #0f0f0f; border-radius: 12px; border: 1px solid #404040; width: 100%; height: auto; max-height: 400px; display: block; }
        .status-box { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #404040; margin-top: 20px; text-align: center; }
        .status-title { font-size: 12px; color: #a3a3a3; text-transform: uppercase; margin-bottom: 5px; }
        .status-value { font-size: 22px; font-weight: bold; color: #3b82f6; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="color: #fff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);">Animasyon 21.4: Kuantum Silici (Quantum Eraser) Deneyi Simülasyonu</h2>
    <div class="subtitle">Polarizör Konumları ve Ekran Mesafesinin İki Teoriye Göre Kıyaslaması</div>

    <div class="controls">
        <div class="control-group">
            <label>Geçerli Fizik Modeli:</label>
            <select id="modelSelect">
                <option value="standart">Standart Fizik (Kuantum Mekaniği)</option>
                <option value="evrenaki">Evrenakı Teorisi (Zerre Modeli)</option>
            </select>
        </div>
        <div class="control-group">
            <label>3. Polarizör (Ekran Önü):</label>
            <button id="eraserToggle" class="toggle-btn">Silici KAPALI</button>
        </div>
        <div class="control-group" id="filterGroup" style="display: none;">
            <label style="color:#eab308;">Bilgisayar Filtresi (Post-Selection):</label>
            <select id="filterSelect" style="border-color:#eab308; background:#2a2a0a;">
                <option value="raw">Ham Veri (Gerçek Fiziksel Ekran)</option>
                <option value="d1">Filtre 1 (D1 Alt Kümesi - Saçak)</option>
                <option value="d2">Filtre 2 (D2 Alt Kümesi - Ters Saçak)</option>
            </select>
        </div>
        <div class="control-group" style="flex: 2;">
            <label>Ekran Mesafesi: <span id="distLabel">10 cm</span> <span style="font-size:11px; font-weight:normal; color:#a3a3a3;">(Gerçek optik deneyler genelde 100-150cm arasındadır)</span></label>
            <input type="range" id="distanceSlider" min="10" max="150" value="10">
        </div>
    </div>

    <canvas id="simCanvas" width="900" height="400"></canvas>

    <div class="status-box">
        <div class="status-title">Ekranda Gözlemlenen Sonuç</div>
        <div class="status-value" id="resultStatus">GİRİŞİM YOK (Dalga Çöktü)</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const modelSelect = document.getElementById('modelSelect');
    const eraserToggle = document.getElementById('eraserToggle');
    const filterGroup = document.getElementById('filterGroup');
    const filterSelect = document.getElementById('filterSelect');
    const distanceSlider = document.getElementById('distanceSlider');
    const distLabel = document.getElementById('distLabel');
    const resultStatus = document.getElementById('resultStatus');

    let isEraserOn = false;

    eraserToggle.addEventListener('click', () => {
        isEraserOn = !isEraserOn;
        eraserToggle.textContent = isEraserOn ? 'Silici AÇIK (45°)' : 'Silici KAPALI';
        eraserToggle.className = isEraserOn ? 'toggle-btn active' : 'toggle-btn';
        draw();
    });

    filterSelect.addEventListener('change', draw);

    distanceSlider.addEventListener('input', () => {
        distLabel.textContent = distanceSlider.value + ' cm';
        draw();
    });

    modelSelect.addEventListener('change', draw);

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let distCm = parseInt(distanceSlider.value);
        let screenX = 350 + ((distCm - 10) / 140) * 450; 
        let model = modelSelect.value;
        let filter = filterSelect.value;
        
        // Sadece Standart Fizik ve Silici Açıkken filtre menüsünü göster
        if (model === 'standart' && isEraserOn) {
            filterGroup.style.display = 'flex';
        } else {
            filterGroup.style.display = 'none';
        }
        
        let interference = 0;
        let phaseOffset = 0;

        if (model === 'standart') {
            if (isEraserOn) {
                if (filter === 'raw') {
                    interference = 0.0;
                    resultStatus.innerHTML = "GİRİŞİM YOK <span style='font-size:14px; font-weight:normal;'><br>(Fiziksel Ekranda Asla Girişim Oluşmaz, Saçaklar Sadece Bilgisayarda Görünür!)</span>";
                    resultStatus.style.color = "#dc2626";
                } else if (filter === 'd1') {
                    interference = 1.0;
                    phaseOffset = 0;
                    resultStatus.textContent = "BİLGİSAYAR İLLÜZYONU (Sadece D1 eşleşmeleri filtrelendi - Saçak/Fringe)";
                    resultStatus.style.color = "#eab308";
                } else if (filter === 'd2') {
                    interference = 1.0;
                    phaseOffset = Math.PI;
                    resultStatus.textContent = "TERS BİLGİSAYAR İLLÜZYONU (D2 eşleşmeleri. D1 ile birleşince ekranı sıfırlar!)";
                    resultStatus.style.color = "#eab308";
                }
            } else {
                interference = 0.0;
                resultStatus.textContent = "GİRİŞİM YOK (Homojen Aydınlık - Dalga Çöktü)";
                resultStatus.style.color = "#dc2626";
            }
        } else {
            // Evrenakı Modeli
            interference = 0.0; // Polarizörler yarığa yapışık olduğu için alan bozuldu, girişim ASLA olmaz!
            
            resultStatus.innerHTML = "GİRİŞİM YOK <span style='font-size:14px; font-weight:normal;'><br>(Polarizörler yarığa yapışık olduğu için Evrenakı alanı kaynağında bozuldu. Mesafe uzasa da fiziksel girişim ASLA oluşmaz!)</span>";
            resultStatus.style.color = "#dc2626";
        }

        // Lazer
        ctx.fillStyle = '#ff9100';
        ctx.fillRect(20, 190, 40, 20);
        ctx.fillStyle = '#fff';
        ctx.font = "12px Arial";
        ctx.fillText("LAZER", 22, 204);

        // Çift Yarık Engeli
        ctx.fillStyle = '#525252';
        ctx.fillRect(150, 50, 10, 130); 
        ctx.fillRect(150, 190, 10, 20);  
        ctx.fillRect(150, 220, 10, 130); 

        let slit1Y = 185;
        let slit2Y = 215;
        
        // Işık Yolları (Lazere)
        ctx.beginPath();
        ctx.moveTo(60, 200);
        ctx.lineTo(150, slit1Y);
        ctx.moveTo(60, 200);
        ctx.lineTo(150, slit2Y);
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 1. İşaretleyici Polarizör (Yatay 0)
        ctx.fillStyle = 'rgba(59, 130, 246, 0.8)';
        ctx.fillRect(162, slit1Y - 10, 8, 20);
        ctx.fillStyle = '#3b82f6';
        ctx.fillText("0° (Yatay)", 125, slit1Y - 15);
        
        // 2. İşaretleyici Polarizör (Dikey 90)
        ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
        ctx.fillRect(162, slit2Y - 10, 8, 20);
        ctx.fillStyle = '#ef4444';
        ctx.fillText("90° (Dikey)", 125, slit2Y + 28);

        // Silici Polarizör (Ekran Önü)
        if (isEraserOn) {
            ctx.fillStyle = 'rgba(34, 197, 94, 0.8)';
            ctx.fillRect(screenX - 25, 80, 10, 240);
            ctx.fillStyle = '#22c55e';
            ctx.fillText("SİLİCİ (45°)", screenX - 45, 70);
        }

        // Ekran
        ctx.fillStyle = '#a3a3a3';
        ctx.fillRect(screenX, 50, 10, 300);
        ctx.fillStyle = '#fff';
        ctx.fillText("EKRAN", screenX - 15, 40);

        // Işık yolları (Yarıktan Ekrana)
        ctx.beginPath();
        for(let i=0; i<300; i+=10) {
            ctx.moveTo(170, slit1Y);
            ctx.lineTo(isEraserOn ? screenX - 25 : screenX, 50 + i);
        }
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.05)';
        ctx.stroke();
        
        ctx.beginPath();
        for(let i=0; i<300; i+=10) {
            ctx.moveTo(170, slit2Y);
            ctx.lineTo(isEraserOn ? screenX - 25 : screenX, 50 + i);
        }
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.05)';
        ctx.stroke();

        // Girişim Deseni (Ekran Yanı)
        for(let y=50; y<350; y+=4) {
            let relativeY = y - 200; 
            let phase = (relativeY * 0.15) + phaseOffset; 
            let fringeIntensity = Math.pow(Math.cos(phase), 2);
            let brightness = 0.5 + interference * (fringeIntensity - 0.5);
            let alpha = brightness * 0.9;
            ctx.fillStyle = `rgba(168, 85, 247, ${alpha})`;
            ctx.fillRect(screenX + 10, y, 40, 4);
        }
        
        ctx.strokeStyle = '#525252';
        ctx.lineWidth = 1;
        ctx.strokeRect(screenX + 10, 50, 40, 300);
        ctx.fillStyle = '#a3a3a3';
        ctx.font = "10px Arial";
        ctx.fillText("DESEN", screenX + 12, 365);
    }

    draw();
</script>
</body>
</html>
